<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --a:#19e3ff; --b:#ff2e88; --acc:#19e3ff; --glass:rgba(6,10,24,.82); --solid:rgba(6,10,24,.95); --ink:#eaf9ff; }
  html,body { margin:0; width:1920px; height:1080px; background:transparent; overflow:hidden;
    font-family:'Oxanium','Segoe UI',Arial,sans-serif; color:var(--ink); }
  .pg { position:absolute; opacity:0; pointer-events:none; transition:opacity .5s, transform .5s; }
  .pg.on { opacity:1; }
  .top { top:48px; left:50%; transform:translateX(-50%) translateY(-30px); }
  .top.on { transform:translateX(-50%); }
  #score { display:flex; height:120px; }
  .team { display:flex; align-items:center; gap:28px; padding:0 40px; background:var(--glass); min-width:420px; }
  .team.a { clip-path:polygon(0 0,100% 0,calc(100% - 28px) 100%,0 100%); border-bottom:4px solid var(--a); justify-content:flex-end; }
  .team.b { clip-path:polygon(28px 0,100% 0,100% 100%,0 100%); border-bottom:4px solid var(--b); flex-direction:row-reverse; justify-content:flex-end; }
  .name { font-size:44px; font-weight:700; letter-spacing:.04em; white-space:nowrap; }
  .score { font-size:84px; font-weight:800; min-width:90px; text-align:center; font-variant-numeric:tabular-nums; text-shadow:0 0 24px currentColor; }
  .a .score { color:var(--a); } .b .score { color:var(--b); }
  .score.pop { animation:pop .45s ease-out; }
  @keyframes pop { 0%{transform:scale(1.45);filter:brightness(2)} 100%{transform:scale(1);filter:none} }
  #mid { display:flex; align-items:center; justify-content:center; min-width:170px; padding:0 22px; background:var(--solid);
    font-size:30px; font-weight:700; letter-spacing:.1em; color:var(--acc); text-align:center; font-variant-numeric:tabular-nums; }
  #timer { padding:10px 70px; background:var(--glass); border-bottom:4px solid var(--acc); clip-path:polygon(28px 0,calc(100% - 28px) 0,100% 100%,0 100%); }
  #timer .t { font-size:130px; font-weight:800; color:var(--acc); text-shadow:0 0 28px currentColor; font-variant-numeric:tabular-nums; line-height:1.1; }
  #soon { inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--solid); text-align:center; }
  #soon .h { font-size:160px; font-weight:800; letter-spacing:.05em; }
  #soon .s { font-size:54px; font-weight:500; margin-top:10px; opacity:.85; }
  #soon .t { font-size:140px; font-weight:800; color:var(--acc); text-shadow:0 0 28px currentColor; margin-top:40px; font-variant-numeric:tabular-nums; }
  #lower { left:80px; bottom:90px; padding:18px 50px 18px 34px; background:var(--glass); border-left:8px solid var(--acc);
    clip-path:polygon(0 0,100% 0,calc(100% - 24px) 100%,0 100%); transform:translateX(-60px); }
  #lower.on { transform:none; }
  #lower .n { font-size:56px; font-weight:800; } #lower .r { font-size:30px; font-weight:500; color:var(--acc); }
  #goal { right:80px; bottom:90px; width:708px; transform-origin:right bottom;
    transform:translate(var(--gx,0),var(--gy,0)) translateY(40px) scale(var(--gs,1)); }
  #goal.inst { transition:none; }
  #gCard { position:relative; z-index:1; box-sizing:border-box; padding:18px 34px 22px; background:var(--gg); border-bottom:4px solid var(--gf); color:var(--gk);
    clip-path:polygon(24px 0,100% 0,100% 100%,0 100%); }
  #goal.on { transform:translate(var(--gx,0),var(--gy,0)) scale(var(--gs,1)); }
  #goal.pbl { right:auto; left:80px; transform-origin:left bottom; }
  #goal.pc { right:auto; bottom:auto; left:50%; top:50%; --gx:-50%; --gy:-50%; transform-origin:center; }
  #goal .gh { display:flex; justify-content:space-between; align-items:baseline; font-size:30px; font-weight:700; letter-spacing:.08em; }
  #goal .gn { font-size:52px; font-weight:800; color:var(--gf); text-shadow:0 0 20px currentColor; font-variant-numeric:tabular-nums; }
  #goal .gn.bump { animation:bump .5s ease-out; }
  .gbar { height:26px; margin-top:10px; background:var(--gt); transform:skewX(-20deg); overflow:hidden; }
  #goal.nobar .gw { display:none; }
  .gbar i { display:block; height:100%; width:0; background:var(--gf); box-shadow:0 0 18px var(--gf); position:relative; overflow:hidden; transition:width .9s cubic-bezier(.2,.9,.3,1); }
  .gbar i::after { content:""; position:absolute; inset:0; background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%); animation:shine 2.4s linear infinite; }
  #goal .gd { display:none; font-size:28px; font-weight:800; color:var(--gf); letter-spacing:.14em; margin-top:8px; text-align:center; }
  #goal.done .gd { display:block; animation:gdp .8s ease-in-out infinite alternate; }
  #goal.done { animation:gpulse 1.6s ease-in-out infinite; }
  #gPlus { position:absolute; right:40px; top:30px; font-size:44px; font-weight:800; color:var(--gf); opacity:0; }
  #gPlus.go { animation:plus 1.1s ease-out; }
  .gw { position:relative; }
  #gTip { position:absolute; left:0; top:-4px; transform:translate(-50%,-100%); padding:0 12px; background:var(--gf); color:#04121a; font-size:26px; font-weight:800; opacity:0; transition:left .9s cubic-bezier(.2,.9,.3,1); }
  #gTip.go { animation:tip 1.4s ease-out .3s; }
  #gFill.surge { animation:surge .9s ease-out; }
  #goal .gn.spin { animation:spin 1s ease-in-out; }
  @keyframes tip { 0%{opacity:0;transform:translate(-50%,-60%) scale(.4)} 20%{opacity:1;transform:translate(-50%,-100%) scale(1.3)} 100%{opacity:0;transform:translate(-50%,-190%) scale(1)} }
  @keyframes surge { 0%{filter:brightness(2.4)} 100%{filter:none} }
  @keyframes spin { 0%{transform:perspective(500px) rotateY(0)} 50%{text-shadow:0 0 40px currentColor,0 0 80px currentColor} 100%{transform:perspective(500px) rotateY(720deg)} }
  #gFx { position:absolute; left:50%; top:50%; width:0; height:0; pointer-events:none; }
  #gBloom, #gRays, .gring, #gOne, #gSp i { position:absolute; opacity:0; }
  #gBloom { z-index:0; width:1100px; height:520px; left:-550px; top:-260px; border-radius:50%; background:radial-gradient(closest-side,var(--gl0) 0,var(--gl1) 40%,transparent 100%); }
  #gRays { z-index:0; width:1500px; height:1500px; left:-750px; top:-750px; background:repeating-conic-gradient(var(--gl2) 0 5deg,transparent 5deg 15deg);
    -webkit-mask:radial-gradient(circle,#000 0,transparent 62%); mask:radial-gradient(circle,#000 0,transparent 62%); }
  .gring { z-index:2; width:240px; height:240px; left:-120px; top:-120px; border:5px solid var(--gf); border-radius:50%; box-shadow:0 0 24px var(--gf); }
  #gSp { position:absolute; z-index:2; }
  #gSp i { left:-6px; top:-6px; width:12px; height:12px; box-shadow:0 0 12px 2px var(--gf); }
  #gOne { z-index:2; left:-300px; top:-100px; width:600px; height:200px; line-height:200px; text-align:center; font-size:170px; font-weight:800; color:var(--gk); text-shadow:0 0 30px var(--gf),0 0 80px var(--gf); }
  #gFx.go #gBloom { animation:gbloom 2.6s ease-out both; }
  #gFx.go #gRays { animation:grays 2.6s linear both; }
  #gFx.go .gring { animation:gring 1.4s ease-out both; }
  #gFx.go #gSp i { animation:gfly 1.3s ease-out var(--del) forwards; }
  #gFx.go #gOne { animation:gone 1.7s ease-in-out both; }
  #gCard.warp { animation:warp 1s cubic-bezier(.2,.9,.3,1.1) 1.2s both; }
  @keyframes gbloom { 0%{opacity:0;transform:scale(.2)} 12%{opacity:1;transform:scale(.8)} 45%{opacity:.5;transform:scale(1)} 58%{opacity:1;transform:scale(1.15)} 100%{opacity:0;transform:scale(1.5)} }
  @keyframes grays { 0%{opacity:0;transform:rotate(0) scale(.3)} 15%{opacity:1} 60%{opacity:.9} 100%{opacity:0;transform:rotate(70deg) scale(1.1)} }
  @keyframes gring { 0%{opacity:.9;transform:scale(.2)} 100%{opacity:0;transform:scale(9)} }
  @keyframes gfly { 0%{transform:translate(0,0) scale(1);opacity:1} 100%{transform:translate(var(--x),var(--y)) scale(.2);opacity:0} }
  @keyframes gone {
    0%{opacity:0;transform:perspective(700px) scale(.1,.1) rotateY(0) rotateZ(-180deg) skewX(0);filter:blur(6px)}
    16%{opacity:1;transform:perspective(700px) scale(1.15,1.15) rotateY(0) rotateZ(0) skewX(0);filter:blur(0)}
    50%{opacity:1;transform:perspective(700px) scale(1,1) rotateY(360deg) rotateZ(6deg) skewX(-10deg)}
    78%{opacity:1;transform:perspective(700px) scale(1.25,.8) rotateY(720deg) rotateZ(-8deg) skewX(-22deg)}
    100%{opacity:0;transform:perspective(700px) scale(5,.4) rotateY(900deg) rotateZ(0) skewX(-22deg);filter:blur(10px)} }
  @keyframes warp {
    0%{opacity:0;transform:perspective(900px) scale(.12,.45) rotateY(-540deg) skewX(30deg);filter:blur(14px) brightness(3)}
    60%{opacity:1;filter:blur(2px) brightness(1.8)}
    100%{opacity:1;transform:perspective(900px) scale(1,1) rotateY(0) skewX(0);filter:blur(0) brightness(1)} }
  @keyframes bump { 0%{transform:scale(1.35);filter:brightness(2)} 100%{transform:none;filter:none} }
  @keyframes shine { from{transform:translateX(-100%)} to{transform:translateX(100%)} }
  @keyframes plus { 0%{opacity:1;transform:translateY(20px) scale(1.4)} 100%{opacity:0;transform:translateY(-40px)} }
  @keyframes gdp { from{opacity:.45} to{opacity:1} }
  @keyframes gpulse { 50%{filter:brightness(1.35)} }
  #raid { position:absolute; inset:0; display:none; z-index:50; overflow:hidden; opacity:0; background:radial-gradient(circle,var(--glass) 0,var(--solid) 75%); }
  #raid::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,transparent 2px 6px); }
  #raid.play { display:block; animation:rIn var(--d,8s) linear forwards; }
  @keyframes rIn { 0%{opacity:0} 5%{opacity:1} 92%{opacity:1} 100%{opacity:0} }
  .rflash { position:absolute; inset:0; background:#fff; opacity:0; }
  .play .rflash { animation:flash .7s ease-out; }
  @keyframes flash { 0%{opacity:.95} 100%{opacity:0} }
  .ring { position:absolute; left:50%; top:50%; width:200px; height:200px; margin:-100px; border:8px solid var(--r1); border-radius:50%; opacity:0; }
  .play .ring { animation:ring 2s ease-out forwards; }
  @keyframes ring { 0%{transform:scale(.2);opacity:.9} 100%{transform:scale(16);opacity:0} }
  .rt { position:absolute; left:0; right:0; text-align:center; white-space:nowrap; opacity:0; }
  .play .rt { animation:slam .9s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes slam { 0%{transform:scale(4);opacity:0} 100%{transform:scale(1);opacity:1} }
  #rHead { top:250px; font-size:150px; font-weight:800; letter-spacing:.08em; color:var(--r1); text-shadow:0 0 50px currentColor; }
  #rName { top:430px; font-size:240px; font-weight:800; color:#fff; text-shadow:0 0 60px var(--r2),0 0 20px var(--r2); }
  #rCount { top:740px; font-size:84px; font-weight:700; color:var(--r2); text-shadow:0 0 30px currentColor; font-variant-numeric:tabular-nums; }
  #rMsg { top:870px; font-size:50px; font-weight:500; color:var(--ink); }
  #rP i { position:absolute; left:50%; top:50%; width:12px; height:12px; opacity:0; }
  .play #rP i { animation:fly 2.2s ease-out var(--del) forwards; }
  @keyframes fly { 0%{transform:translate(0,0) rotate(0);opacity:1} 100%{transform:translate(var(--x),var(--y)) rotate(540deg) scale(.2);opacity:0} }
  @media (prefers-reduced-motion:reduce){ .score.pop,.gn.bump,#gPlus.go,.gbar i::after,#gTip.go,#gFill.surge,#goal .gn.spin,#gCard.warp{animation:none} #gFx{display:none} .pg{transition:none} }
</style>
</head>
<body>
<div id="score" class="pg top">
  <div class="team a"><div class="name" id="nameA">TEAM A</div><div class="score" id="scoreA">0</div></div>
  <div id="mid">VS</div>
  <div class="team b"><div class="name" id="nameB">TEAM B</div><div class="score" id="scoreB">0</div></div>
</div>
<div id="timer" class="pg top"><div class="t" id="tBig">0:00</div></div>
<div id="soon" class="pg"><div class="h" id="soonH"></div><div class="s" id="soonS"></div><div class="t" id="soonT"></div></div>
<div id="lower" class="pg"><div class="n" id="lowN"></div><div class="r" id="lowR"></div></div>
<div id="goal" class="pg">
<div id="gFx"><div id="gBloom"></div><div id="gRays"></div><b class="gring"></b><b class="gring" style="animation-delay:.18s"></b><div id="gSp"></div><div id="gOne"></div></div>
<div id="gCard"><div class="gh"><span id="gLabel"></span><span class="gn" id="gNum"></span></div><div class="gw"><div class="gbar"><i id="gFill"></i></div><b id="gTip"></b></div><div class="gd">GOAL REACHED!</div><div id="gPlus"></div></div></div>
<div id="raid"><div class="rflash"></div><b class="ring"></b><b class="ring" style="animation-delay:.25s;border-color:var(--r2)"></b><b class="ring" style="animation-delay:.5s"></b><div id="rP"></div>
<div class="rt" id="rHead"></div><div class="rt" id="rName" style="animation-delay:.35s"></div><div class="rt" id="rCount" style="animation-delay:.7s"></div><div class="rt" id="rMsg" style="animation-delay:1s"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyBKUIKlJFekXZBqGFDJPSbB26uyUc2erB4",
  authDomain: "scoreboard-64131.firebaseapp.com",
  databaseURL: "https://scoreboard-64131-default-rtdb.firebaseio.com",
  projectId: "scoreboard-64131",
  storageBucket: "scoreboard-64131.firebasestorage.app",
  messagingSenderId: "898885184342",
  appId: "1:898885184342:web:1434e53e5af35b18d4c4f7"
});
const $ = id => document.getElementById(id);
const rgba = (h,a) => { const n=parseInt(h.slice(1),16); return `rgba(${n>>16},${n>>8&255},${n&255},${a})`; };
let d = {}, off = 0; const last = {};
firebase.database().ref('.info/serverTimeOffset').on('value', s => off = s.val() || 0);

function setScore(id, v) {
  const el = $(id);
  if (last[id] !== undefined && last[id] !== v) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  last[id] = v; el.textContent = v;
}
function ms() {
  const base = d.tBase || 0;
  if (!d.tRun || !d.tStart) return base;
  const el = Date.now() + off - d.tStart;
  return d.tMode === 'up' ? base + el : Math.max(0, base - el);
}
function fmt(t) {
  const s = Math.ceil(t / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0');
}
function tick() {
  const t = fmt(d.tMode === 'up' ? Math.floor(ms()/1000)*1000 : ms());

  $('soonT').textContent = (d.tBase > 0 || d.tRun) ? t : '';
  $('mid').textContent = d.timerOnBoard ? t : (d.label || 'VS');
}
setInterval(tick, 200);

let spinT, gLast, rLast, rFirst = true, rT, rI, autoN = null, pollKey = '';
function poll() {
  if (!(d.gAuto && d.gChan && d.gWorker)) return;
  fetch(d.gWorker.replace(/\/+$/, '') + '?login=' + encodeURIComponent(d.gChan)).then(r => r.json()).then(j => {
    if (typeof j.total === 'number' && j.total !== autoN) { if (autoN === null) gLast = undefined; autoN = j.total; goal(); }
  }).catch(() => {});
}
setInterval(poll, 20000);
let shown = null, pendT = null, holdT, popOn = false, pendD = 0, tLast, tFirst = true;
const curNow = () => (d.gAuto && autoN !== null) ? autoN : (d.gCur || 0), totNow = () => Math.max(1, d.gGoal || 100);
function updOn() { $('goal').classList.toggle('on', !!d.gOn && (d.gMode === 'always' || popOn)); }
function showFor(ms) {
  popOn = true; $('goal').classList.add('inst'); updOn(); clearTimeout(holdT);
  holdT = setTimeout(() => { $('goal').classList.remove('inst'); popOn = false; updOn(); }, ms);
}
function sparks() {
  const P = $('gSp'); P.innerHTML = '';
  for (let i = 0; i < 40; i++) {
    const e = document.createElement('i'), a = Math.random() * 6.283, m = 160 + Math.random() * 420, late = i % 2;
    e.style.cssText = `--x:${Math.cos(a)*m}px;--y:${Math.sin(a)*m*.6}px;--del:${(late ? 1.15 : 0) + Math.random() * .25}s;background:var(${i % 3 ? '--gf' : '--gk'})`;

}
function intro(delta) {
  const f = $('gFx'), c = $('gCard'); $('gOne').textContent = '+' + delta; sparks();
  [f, c].forEach(e => e.classList.remove('go', 'warp')); void f.offsetWidth; f.classList.add('go'); c.classList.add('warp');
}
function render(cur, tot, delta) {
  const pct = Math.min(100, cur / tot * 100) + '%', n = $('gNum');
  n.textContent = cur + ' / ' + tot; $('gFill').style.width = pct; $('gTip').style.left = pct;
  $('goal').classList.toggle('done', cur >= tot); shown = cur;
  if (delta > 0) {
    const p = $('gPlus'), t = $('gTip'), f = $('gFill'); p.textContent = t.textContent = '+' + delta;
    [p, n, t, f].forEach(e => e.classList.remove('go', 'bump', 'spin', 'surge')); void p.offsetWidth;
    p.classList.add('go'); t.classList.add('go'); f.classList.add('surge'); n.classList.add('bump');
    clearTimeout(spinT); spinT = setTimeout(() => { n.classList.remove('bump'); n.classList.add('spin'); }, 2000);
  }
}
function pop(delta) {
  const hold = Math.min(120, Math.max(7, d.gHold || 12)) * 1000;
  if (pendT) { pendD += delta; showFor(hold); return; }
  if (popOn) { render(curNow(), totNow(), delta); showFor(hold); return; }
  pendD = delta; intro(delta); showFor(hold);
  pendT = setTimeout(() => { pendT = null; render(curNow(), totNow(), pendD); pendD = 0; }, 2300);
}
function goal() {
  const r = document.documentElement.style, g = $('goal'), cur = curNow(), tot = totNow(), gf = d.cGF || '#19e3ff', gk = d.cGK || '#eaf9ff';
  r.setProperty('--gf', gf); r.setProperty('--gt', d.cGT || '#1a2440'); r.setProperty('--gk', gk); r.setProperty('--gg', rgba(d.cGB || '#060a18', .82));
  r.setProperty('--gl0', rgba(gk, .35)); r.setProperty('--gl1', rgba(gf, .55)); r.setProperty('--gl2', rgba(gf, .3));
  $('gLabel').textContent = d.gLabel || 'FOLLOWER GOAL';
  g.classList.toggle('nobar', !!d.gNoBar); g.classList.toggle('pbl', d.gPos === 'bl'); g.classList.toggle('pc', d.gPos === 'c');
  g.style.setProperty('--gs', Math.min(2, Math.max(.1, d.gScale || 1)));
  const rose = gLast !== undefined && cur > gLast, delta = rose ? cur - gLast : 0; gLast = cur;
  if (rose && d.gOn) { if (d.gMode === 'always') render(cur, tot, delta); else pop(delta); }
  else if (!pendT) render(cur, tot, 0);
  updOn();
}
function trigCheck() {
  if (tFirst) { tFirst = false; tLast = d.gTrig; return; }
  if (d.gTrig && d.gTrig !== tLast) { tLast = d.gTrig; if (d.gOn) { if (d.gMode === 'always') render(curNow(), totNow(), 1); else pop(1); } }
}
function raidCheck() {
  if (rFirst) { rFirst = false; rLast = d.rTrig; return; }
  if (d.rTrig && d.rTrig !== rLast) { rLast = d.rTrig; raid(); }
}
function raid() {
  const el = $('raid'), r = document.documentElement.style, dur = Math.min(30, Math.max(4, d.rDur || 8)), name = d.rName || 'A FRIEND';
  r.setProperty('--r1', d.cR1 || '#ff2e88'); r.setProperty('--r2', d.cR2 || '#19e3ff'); r.setProperty('--d', dur + 's');
  $('rHead').textContent = d.rHead || 'INCOMING RAID'; $('rMsg').textContent = d.rMsg || ''; $('rName').textContent = name;
  $('rName').style.fontSize = Math.max(90, Math.min(240, Math.floor(1600 / (name.length * .8)))) + 'px';
  const P = $('rP'); P.innerHTML = '';
  for (let i = 0; i < 80; i++) {
    const e = document.createElement('i'), a = Math.random() * 6.283, m = 300 + Math.random() * 900;
    e.style.cssText = `--x:${Math.cos(a)*m}px;--y:${Math.sin(a)*m}px;--del:${Math.random()*.5}s;background:var(${i % 2 ? '--r1' : '--r2'})`; P.appendChild(e);
  }
  el.classList.remove('play'); void el.offsetWidth; el.classList.add('play');
  const n = +d.rCount || 0, c = $('rCount'), t0 = Date.now(); clearInterval(rI); clearTimeout(rT); c.textContent = '';
  if (n > 0) rI = setInterval(() => { const k = Math.min(1, (Date.now() - t0) / 2000); c.textContent = '+' + Math.round(n * k) + ' VIEWERS'; if (k >= 1) clearInterval(rI); }, 40);
  rT = setTimeout(() => el.classList.remove('play'), dur * 1000);
}
firebase.database().ref('board').on('value', snap => {
  d = snap.val() || {};
  const r = document.documentElement.style;
  r.setProperty('--a', d.cA || '#19e3ff'); r.setProperty('--b', d.cB || '#ff2e88');
  r.setProperty('--acc', d.cAcc || '#19e3ff'); r.setProperty('--ink', d.cText || '#eaf9ff');
  r.setProperty('--glass', rgba(d.cBg || '#060a18', .82)); r.setProperty('--solid', rgba(d.cBg || '#060a18', .95));
  $('nameA').textContent = d.nameA || 'TEAM A'; $('nameB').textContent = d.nameB || 'TEAM B';
  setScore('scoreA', d.scoreA || 0); setScore('scoreB', d.scoreB || 0);
  $('soonH').textContent = d.soonH || 'STARTING SOON'; $('soonS').textContent = d.soonS || '';
  $('lowN').textContent = d.lowN || ''; $('lowR').textContent = d.lowR || '';
  const p = d.page || (d.visible === false ? 'off' : 'score');
  $('score').classList.toggle('on', p === 'score');
  $('timer').classList.toggle('on', p === 'timer');
  $('soon').classList.toggle('on', p === 'soon');
  $('lower').classList.toggle('on', !!d.lowOn && !!d.lowN);
  goal(); trigCheck(); raidCheck(); tick();
  const pk = [d.gAuto, d.gChan, d.gWorker].join('|'); if (pk !== pollKey) { pollKey = pk; autoN = null; poll(); }
});
</script>
