<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --a:#19e3ff; --b:#ff2e88; --acc:#19e3ff; --glass:rgba(6,10,24,.82); --solid:rgba(6,10,24,.95); --ink:#eaf9ff; }
  html,body { margin:0; width:1920px; height:1080px; background:transparent; overflow:hidden;
    font-family:'Oxanium','Segoe UI',Arial,sans-serif; color:var(--ink); }
  .pg { position:absolute; opacity:0; pointer-events:none; transition:opacity .5s, transform .5s; }
  .pg.on { opacity:1; }
  .top { top:48px; left:50%; transform:translateX(-50%) translateY(-30px); }
  .top.on { transform:translateX(-50%); }
  #score { display:flex; height:120px; }
  .team { display:flex; align-items:center; gap:28px; padding:0 40px; background:var(--glass); min-width:420px; }
  .team.a { clip-path:polygon(0 0,100% 0,calc(100% - 28px) 100%,0 100%); border-bottom:4px solid var(--a); justify-content:flex-end; }
  .team.b { clip-path:polygon(28px 0,100% 0,100% 100%,0 100%); border-bottom:4px solid var(--b); flex-direction:row-reverse; justify-content:flex-end; }
  .name { font-size:44px; font-weight:700; letter-spacing:.04em; white-space:nowrap; }
  .score { font-size:84px; font-weight:800; min-width:90px; text-align:center; font-variant-numeric:tabular-nums; text-shadow:0 0 24px currentColor; }
  .a .score { color:var(--a); } .b .score { color:var(--b); }
  .score.pop { animation:pop .45s ease-out; }
  @keyframes pop { 0%{transform:scale(1.45);filter:brightness(2)} 100%{transform:scale(1);filter:none} }
  #mid { display:flex; align-items:center; justify-content:center; min-width:170px; padding:0 22px; background:var(--solid);
    font-size:30px; font-weight:700; letter-spacing:.1em; color:var(--acc); text-align:center; font-variant-numeric:tabular-nums; }
  #timer { padding:10px 70px; background:var(--glass); border-bottom:4px solid var(--acc); clip-path:polygon(28px 0,calc(100% - 28px) 0,100% 100%,0 100%); }
  #timer .t { font-size:130px; font-weight:800; color:var(--acc); text-shadow:0 0 28px currentColor; font-variant-numeric:tabular-nums; line-height:1.1; }
  #soon { inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--solid); text-align:center; }
  #soon .h { font-size:160px; font-weight:800; letter-spacing:.05em; }
  #soon .s { font-size:54px; font-weight:500; margin-top:10px; opacity:.85; }
  #soon .t { font-size:140px; font-weight:800; color:var(--acc); text-shadow:0 0 28px currentColor; margin-top:40px; font-variant-numeric:tabular-nums; }
  #lower { left:80px; bottom:90px; padding:18px 50px 18px 34px; background:var(--glass); border-left:8px solid var(--acc);
    clip-path:polygon(0 0,100% 0,calc(100% - 24px) 100%,0 100%); transform:translateX(-60px); }
  #lower.on { transform:none; }
  #lower .n { font-size:56px; font-weight:800; } #lower .r { font-size:30px; font-weight:500; color:var(--acc); }
  #goal { right:80px; bottom:90px; width:708px; transform-origin:right bottom;
    transform:translate(var(--gx,0),var(--gy,0)) translateY(40px) scale(var(--gs,1)); }
  #goal.inst { transition:none; }
  #gCard { position:relative; z-index:1; box-sizing:border-box; padding:18px 34px 22px; background:var(--gg); border-bottom:4px solid var(--gf); color:var(--gk);
    clip-path:polygon(24px 0,100% 0,100% 100%,0 100%); }
  #goal.on { transform:translate(var(--gx,0),var(--gy,0)) scale(var(--gs,1)); }
  #goal.pbl { right:auto; left:80px; transform-origin:left bottom; }
  #goal.pc { right:auto; bottom:auto; left:50%; top:50%; --gx:-50%; --gy:-50%; transform-origin:center; }
  #goal .gh { display:flex; justify-content:space-between; align-items:baseline; font-size:30px; font-weight:700; letter-spacing:.08em; }
  #goal .gn { font-size:52px; font-weight:800; color:var(--gf); text-shadow:0 0 20px currentColor; font-variant-numeric:tabular-nums; }
  #goal .gn.bump { animation:bump .5s ease-out; }
  .gbar { height:26px; margin-top:10px; background:var(--gt); transform:skewX(-20deg); overflow:hidden; }
  #goal.nobar .gw { display:none; }
  .gbar i { display:block; height:100%; width:0; background:var(--gf); box-shadow:0 0 18px var(--gf); position:relative; overflow:hidden; transition:width .9s cubic-bezier(.2,.9,.3,1); }
  .gbar i::after { content:""; position:absolute; inset:0; background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%); animation:shine 2.4s linear infinite; }
  #goal .gd { display:none; font-size:28px; font-weight:800; color:var(--gf); letter-spacing:.14em; margin-top:8px; text-align:center; }
  #goal.done .gd { display:block; animation:gdp .8s ease-in-out infinite alternate; }
  #goal.done { animation:gpulse 1.6s ease-in-out infinite; }
  #gPlus { display:none; position:absolute; right:40px; top:30px; font-size:44px; font-weight:800; color:var(--gf); opacity:0; }
  #gPlus.go { animation:plus 1.1s ease-out; }
  .gw { position:relative; }
  #gTip { position:absolute; left:0; top:13px; transform:translate(-50%,-50%); color:#fff; font-size:28px; font-weight:800; text-shadow:0 0 8px var(--gf),0 0 20px var(--gf); opacity:0; transition:left .9s cubic-bezier(.2,.9,.3,1); }
  #gTip.go { animation:tip 1.4s ease-out .3s; }
  #gFill.surge { animation:surge .9s ease-out; }
  @keyframes tip { 0%{opacity:0;transform:translate(-50%,-50%) scale(.5)} 15%{opacity:1;transform:translate(-30%,-65%) scale(1.25)} 100%{opacity:0;transform:translate(110%,-140%) scale(1)} }
  @keyframes surge { 0%{filter:brightness(2.4)} 100%{filter:none} }
  @keyframes spin { 0%{transform:perspective(500px) rotateY(0)} 50%{text-shadow:0 0 40px currentColor,0 0 80px currentColor} 100%{transform:perspective(500px) rotateY(720deg)} }
  #gFx { position:absolute; left:50%; top:50%; width:0; height:0; pointer-events:none; }
  #gBloom, #gRays, .gring, #gOne, #gSp i { position:absolute; opacity:0; }
  #gBloom { z-index:0; width:1100px; height:520px; left:-550px; top:-260px; border-radius:50%; background:radial-gradient(closest-side,var(--gl0) 0,var(--gl1) 40%,transparent 100%); }
  #gRays { z-index:0; width:1500px; height:1500px; left:-750px; top:-750px; background:repeating-conic-gradient(var(--gl2) 0 5deg,transparent 5deg 15deg);
    -webkit-mask:radial-gradient(circle,#000 0,transparent 62%); mask:radial-gradient(circle,#000 0,transparent 62%); }
  .gring { z-index:2; width:240px; height:240px; left:-120px; top:-120px; border:5px solid var(--gf); border-radius:50%; box-shadow:0 0 24px var(--gf); }
  #gSp { position:absolute; z-index:2; }
  #gSp i { left:-6px; top:-6px; width:12px; height:12px; box-shadow:0 0 12px 2px var(--gf); }
  #gOne { z-index:2; left:-450px; top:-100px; width:900px; height:200px; line-height:200px; text-align:center; font-size:170px; font-weight:800; color:var(--gk); text-shadow:0 0 30px var(--gf),0 0 80px var(--gf); }
  #gFx.go #gBloom { animation:gbloom 2.6s ease-out both; }
  #gFx.go #gRays { animation:grays 2.6s linear both; }
  #gFx.go .gring { animation:gring 1.4s ease-out both; }
  #gFx.go #gSp i { animation:gfly 1.3s ease-out var(--del) forwards; }
  #gFx.go #gOne { animation:gone 1.7s ease-in-out both; }
  #gCard.warp { animation:warp 1s cubic-bezier(.2,.9,.3,1.1) 1.2s both; }
  @keyframes gbloom { 0%{opacity:0;transform:scale(.2)} 12%{opacity:1;transform:scale(.8)} 45%{opacity:.5;transform:scale(1)} 58%{opacity:1;transform:scale(1.15)} 100%{opacity:0;transform:scale(1.5)} }
  @keyframes grays { 0%{opacity:0;transform:rotate(0) scale(.3)} 15%{opacity:1} 60%{opacity:.9} 100%{opacity:0;transform:rotate(70deg) scale(1.1)} }
  @keyframes gring { 0%{opacity:.9;transform:scale(.2)} 100%{opacity:0;transform:scale(9)} }
  @keyframes gfly { 0%{transform:translate(0,0) scale(1);opacity:1} 100%{transform:translate(var(--x),var(--y)) scale(.2);opacity:0} }
  @keyframes gone {
    0%{opacity:0;transform:perspective(700px) scale(.1,.1) rotateY(0) rotateZ(-180deg) skewX(0);filter:blur(6px)}
    16%{opacity:1;transform:perspective(700px) scale(1.15,1.15) rotateY(0) rotateZ(0) skewX(0);filter:blur(0)}
    50%{opacity:1;transform:perspective(700px) scale(1,1) rotateY(360deg) rotateZ(6deg) skewX(-10deg)}
    78%{opacity:1;transform:perspective(700px) scale(1.25,.8) rotateY(720deg) rotateZ(-8deg) skewX(-22deg)}
    100%{opacity:0;transform:perspective(700px) scale(5,.4) rotateY(900deg) rotateZ(0) skewX(-22deg);filter:blur(10px)} }
  @keyframes warp {
    0%{opacity:0;transform:perspective(900px) scale(.12,.45) rotateY(-540deg) skewX(30deg);filter:blur(14px) brightness(3)}
    60%{opacity:1;filter:blur(2px) brightness(1.8)}
    100%{opacity:1;transform:perspective(900px) scale(1,1) rotateY(0) skewX(0);filter:blur(0) brightness(1)} }
  @keyframes bump { 0%{transform:scale(1.35);filter:brightness(2)} 100%{transform:none;filter:none} }
  @keyframes shine { from{transform:translateX(-100%)} to{transform:translateX(100%)} }
  @keyframes plus { 0%{opacity:1;transform:translateY(20px) scale(1.4)} 100%{opacity:0;transform:translateY(-40px)} }
  @keyframes gdp { from{opacity:.45} to{opacity:1} }
  @keyframes gpulse { 50%{filter:brightness(1.35)} }
  /* ---- GOAL REACHED celebration ---- */
  #gWin { position:absolute; inset:0; z-index:55; display:none; opacity:0; transition:opacity 1.2s; pointer-events:none; overflow:hidden; }
  #gWin.show { display:block; } #gWin.on { opacity:1; transition:none; }
  #gWin > *, #gwStage > * { position:absolute; }
  #gwDim { inset:0; background:radial-gradient(ellipse at 50% 44%,rgba(5,10,28,.3) 0,rgba(2,4,14,.82) 100%); opacity:0; }
  .go #gwDim { animation:gwFade .8s ease-out both; }
  #gwGrid { left:-50%; width:200%; bottom:0; height:55%; transform:perspective(500px) rotateX(62deg); transform-origin:50% 100%; opacity:0;
    background:linear-gradient(var(--w1) 2px,transparent 2px) 0 0/100% 90px,linear-gradient(90deg,var(--w1) 2px,transparent 2px) 0 0/90px 100%;
    -webkit-mask:linear-gradient(transparent,#000 85%); mask:linear-gradient(transparent,#000 85%); }
  .go #gwGrid { animation:gwGridIn 1s ease-out .3s both, gwGridMove 1.4s linear infinite; }
  @keyframes gwGridIn { from{opacity:0} to{opacity:.55} }
  @keyframes gwGridMove { from{background-position:0 0,0 0} to{background-position:0 90px,0 0} }
  .gwB { top:0; bottom:0; width:150px; background:linear-gradient(90deg,transparent,var(--w1a),transparent); opacity:0; }
  .go .gwB { animation:gwBeam 1.6s ease-in-out .3s infinite alternate; }
  @keyframes gwBeam { from{opacity:.15} to{opacity:.9} }
  #gwScan { left:0; right:0; top:0; height:4px; opacity:0; background:linear-gradient(90deg,transparent,var(--w1),#fff,var(--w1),transparent); box-shadow:0 0 30px 6px var(--w1); }
  .go #gwScan { animation:gwScan 2.4s linear .4s infinite; }
  @keyframes gwScan { 0%{top:-10px;opacity:0} 8%{opacity:.9} 92%{opacity:.9} 100%{top:1080px;opacity:0} }
  #gwStage { left:50%; top:44%; width:0; height:0; z-index:3; }
  .go #gwStage { animation:gwShake .8s linear 1.1s both; }
  @keyframes gwShake { 0%,100%{transform:none} 10%{transform:translate(-14px,8px)} 25%{transform:translate(12px,-10px)} 40%{transform:translate(-9px,-6px)} 55%{transform:translate(8px,7px)} 70%{transform:translate(-5px,3px)} 85%{transform:translate(3px,-2px)} }
  #gwRays, #gwRays2 { width:2600px; height:2600px; left:-1300px; top:-1300px; opacity:0; -webkit-mask:radial-gradient(circle,#000 0,transparent 55%); mask:radial-gradient(circle,#000 0,transparent 55%); }
  #gwRays { background:repeating-conic-gradient(var(--w1a) 0 4deg,transparent 4deg 14deg); }
  #gwRays2 { background:repeating-conic-gradient(var(--w2a) 0 3deg,transparent 3deg 20deg); }
  .go #gwRays { animation:gwFade 1.5s ease-out both, gwRot 45s linear infinite; }
  .go #gwRays2 { animation:gwFade 1.5s ease-out .3s both, gwRotR 30s linear infinite; }
  #gwRings { left:0; top:0; }
  .gwR { position:absolute; left:-150px; top:-150px; width:300px; height:300px; box-sizing:border-box; border-radius:50%; border:6px solid var(--rc); box-shadow:0 0 30px var(--rc),inset 0 0 30px var(--rc); opacity:0; }
  .go .gwR { animation:gwR 2.2s ease-out var(--d) 3 both; }
  @keyframes gwR { 0%{opacity:.9;transform:scale(.2)} 100%{opacity:0;transform:scale(9)} }
  #gwHud { left:-450px; top:-450px; width:900px; height:900px; opacity:0; filter:drop-shadow(0 0 12px var(--w1)); }
  .go #gwHud { animation:gwHud 1.2s cubic-bezier(.2,.9,.3,1.1) .15s both; }
  @keyframes gwHud { 0%{opacity:0;transform:scale(.2) rotate(-200deg)} 100%{opacity:1;transform:none} }
  #gwHud circle { fill:none; }
  #gwHud .h1 { stroke:var(--w1); stroke-width:3; stroke-dasharray:120 40 8 40; animation:gwRot 16s linear infinite; }
  #gwHud .h2 { stroke:var(--w2); stroke-width:14; stroke-dasharray:2 17.78; animation:gwRotR 24s linear infinite; }
  #gwHud .h3 { stroke:var(--w1); stroke-width:6; stroke-dasharray:260 90 40 90; animation:gwRotR 10s linear infinite; }
  #gwHud .h4 { stroke:var(--w2); stroke-width:2; stroke-dasharray:6 10; animation:gwRot 30s linear infinite; }
  #gwNum { left:-450px; top:-120px; width:900px; height:240px; line-height:240px; text-align:center; font-size:230px; font-weight:800; color:var(--gk); font-variant-numeric:tabular-nums; text-shadow:0 0 30px var(--w1); opacity:0; }
  .go #gwNum { animation:gwNum 1s cubic-bezier(.2,1.3,.4,1) .5s both, gwPulse 1.4s ease-in-out 1.6s infinite alternate; }
  @keyframes gwNum { 0%{opacity:0;transform:perspective(800px) scale(.1) rotateY(-540deg);filter:blur(12px)} 100%{opacity:1;transform:none;filter:none} }
  @keyframes gwPulse { from{text-shadow:0 0 25px var(--w1),0 0 60px var(--w1)} to{text-shadow:0 0 45px var(--w2),0 0 110px var(--w1)} }
  #gwBand { left:-900px; top:150px; width:1800px; height:170px; transform:scaleX(0); border-top:3px solid var(--w1); border-bottom:3px solid var(--w2); box-shadow:0 0 40px var(--w1a);
    background:linear-gradient(90deg,transparent,rgba(6,10,24,.9) 10%,rgba(6,10,24,.9) 90%,transparent); }
  .go #gwBand { animation:gwBand .7s cubic-bezier(.2,.9,.3,1) .8s both; }
  @keyframes gwBand { to{transform:scaleX(1)} }
  #gwHead { left:-900px; top:150px; width:1800px; height:170px; line-height:170px; text-align:center; font-weight:800; letter-spacing:.1em; color:#fff; white-space:nowrap; text-shadow:0 0 30px var(--w1),0 0 80px var(--w1); perspective:800px; }
  #gwHead i { display:inline-block; font-style:normal; opacity:0; }
  .go #gwHead i { animation:gwLet .8s cubic-bezier(.2,1.3,.4,1) calc(1.1s + var(--i) * .07s) both; }
  .go #gwHead { animation:gwGl 3.4s steps(1) 3.5s infinite; }
  @keyframes gwLet { 0%{opacity:0;transform:translateY(-260px) scale(3.2) rotateX(80deg);filter:blur(14px)} 60%{opacity:1;filter:blur(0)} 100%{opacity:1;transform:none;filter:none} }
  @keyframes gwGl { 0%,88%,100%{transform:none;text-shadow:0 0 30px var(--w1),0 0 80px var(--w1)} 90%{transform:translateX(7px) skewX(-8deg);text-shadow:-9px 0 0 var(--w2),9px 0 0 var(--w1),0 0 40px var(--w1)} 94%{transform:translateX(-6px);text-shadow:9px 0 0 var(--w2),-9px 0 0 var(--w1),0 0 40px var(--w2)} 97%{transform:translateX(3px) skewX(5deg)} }
  #gwSub { left:-900px; top:335px; width:1800px; text-align:center; font-size:52px; font-weight:700; letter-spacing:.3em; color:var(--gk); text-shadow:0 0 20px var(--w2); opacity:0; }
  .go #gwSub { animation:gwSub 1s ease-out 2.5s both; }
  @keyframes gwSub { from{opacity:0;letter-spacing:.9em;filter:blur(8px)} to{opacity:1;letter-spacing:.3em;filter:none} }
  #gwTL, #gwTR { z-index:3; top:60px; font-size:26px; font-weight:700; letter-spacing:.3em; color:var(--w1); text-shadow:0 0 12px var(--w1); padding:6px 16px; border-left:5px solid var(--w2); background:rgba(6,10,24,.6); opacity:0; }
  #gwTL { left:70px; } #gwTR { right:70px; }
  .go #gwTL, .go #gwTR { animation:gwFade .5s ease-out 1.2s both, gwBlink 1.1s steps(2) 2s infinite; }
  @keyframes gwBlink { 50%{opacity:.5} }
  #gwFlash { inset:0; z-index:4; opacity:0; background:radial-gradient(circle at 50% 44%,#fff 0,var(--w1) 38%,transparent 78%); }
  .go #gwFlash { animation:gwFl 1.1s ease-out both; }
  @keyframes gwFl { 0%{opacity:1} 100%{opacity:0} }
  #gWin canvas { left:0; top:0; z-index:5; }
  @keyframes gwFade { from{opacity:0} to{opacity:1} }
  @keyframes gwRot { to{transform:rotate(360deg)} }
  @keyframes gwRotR { to{transform:rotate(-360deg)} }
  /* ---- word guessing game ---- */
  .gm { position:absolute; z-index:30; display:none; }
  .gm.on { display:block; animation:gmIn .6s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes gmIn { from{opacity:0;filter:blur(8px)} }
  #gmBox { width:940px; padding:16px 34px 20px; text-align:center; background:var(--glass); border-top:3px solid var(--acc); border-bottom:3px solid var(--b);
    clip-path:polygon(34px 0,100% 0,calc(100% - 34px) 100%,0 100%); filter:drop-shadow(0 0 22px rgba(0,0,0,.5)); }
  .gm-top { display:flex; justify-content:space-between; font-size:24px; letter-spacing:.22em; color:var(--acc); text-transform:uppercase; padding:0 28px; }
  .gm-hint { font-size:34px; letter-spacing:.08em; color:var(--ink); text-transform:uppercase; margin:6px 0 2px; text-shadow:0 0 16px var(--acc); }
  .gm-word { font-size:92px; font-weight:800; letter-spacing:.14em; color:var(--ink); line-height:1.15; margin:4px 0 8px; white-space:nowrap; text-shadow:0 0 26px var(--acc); }
  .gm-word i { display:inline-block; font-style:normal; min-width:.6em; }
  .gm-word i.rv { color:var(--acc); }
  .gm-word i.new { animation:gmPop .7s cubic-bezier(.2,1.4,.4,1); }
  @keyframes gmPop { 0%{transform:translateY(-46px) scale(2.2);opacity:0} 100%{transform:none;opacity:1} }
  #gmBox[data-st=won] .gm-word i, #gmBox[data-st=timeup] .gm-word i { color:var(--b); text-shadow:0 0 30px var(--b); animation:gmWord 1s ease both; animation-delay:calc(var(--i) * 70ms); }
  #gmBox[data-st=timeup] .gm-word i { color:var(--ink); text-shadow:0 0 14px var(--acc); }
  @keyframes gmWord { 0%{transform:scale(1.6);opacity:.2} 60%{transform:scale(.95)} 100%{transform:none;opacity:1} }
  .gm-bar { height:6px; margin:4px 28px 10px; background:rgba(255,255,255,.12); border-radius:3px; overflow:hidden; }
  .gm-bar b { display:block; height:100%; width:100%; background:linear-gradient(90deg,var(--acc),var(--b)); transition:width .25s linear; }
  #gmBox:not([data-st=play]) .gm-bar { opacity:0; }
  .gm-foot { font-size:28px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink); min-height:34px; }
  #gmBox[data-st=won] .gm-foot { color:var(--b); font-size:36px; text-shadow:0 0 24px var(--b); animation:gmFoot 1s ease both; }
  @keyframes gmFoot { from{opacity:0;transform:scale(1.5)} }
  #glBox { width:400px; padding:14px 20px 16px; background:var(--glass); border-left:3px solid var(--acc); border-right:3px solid var(--b); clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px)); filter:drop-shadow(0 0 18px rgba(0,0,0,.5)); }
  .gl-h { font-size:24px; letter-spacing:.3em; color:var(--acc); text-align:center; margin-bottom:8px; }
  #glList { list-style:none; margin:0; padding:0; }
  #glList li { display:flex; gap:12px; align-items:baseline; font-size:28px; padding:4px 0; border-bottom:1px solid rgba(255,255,255,.08); color:var(--ink); }
  #glList li b { width:34px; color:var(--b); }
  #glList li span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-transform:uppercase; }
  #glList li em { font-style:normal; color:var(--acc); font-weight:800; }
  #glList li.hot { animation:glHot 1.4s ease; }
  @keyframes glHot { 0%,40%{background:rgba(255,255,255,.22)} }
  .gl-empty { text-align:center; font-size:22px; letter-spacing:.2em; color:rgba(255,255,255,.5); padding:8px 0; }
  #raid { position:absolute; inset:0; display:none; z-index:50; overflow:hidden; opacity:0; background:radial-gradient(circle,var(--glass) 0,var(--solid) 75%); }
  #raid::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,transparent 2px 6px); }
  #raid.play { display:block; animation:rIn var(--d,8s) linear forwards; }
  @keyframes rIn { 0%{opacity:0} 5%{opacity:1} 92%{opacity:1} 100%{opacity:0} }

  setScore('scoreA', d.scoreA || 0); setScore('scoreB', d.scoreB || 0);
  $('soonH').textContent = d.soonH || 'STARTING SOON'; $('soonS').textContent = d.soonS || '';
  $('lowN').textContent = d.lowN || ''; $('lowR').textContent = d.lowR || '';
  const p = d.page || (d.visible === false ? 'off' : 'score');
  if (pPrev !== undefined && p !== pPrev) snd('pageChange'); pPrev = p;
  $('score').classList.toggle('on', p === 'score');
  $('timer').classList.toggle('on', p === 'timer');
  $('soon').classList.toggle('on', p === 'soon');
  const lo = !!d.lowOn && !!d.lowN; if (lo && lowPrev === false) snd('lowerIn'); lowPrev = lo;
  $('lower').classList.toggle('on', lo);
  goal(); trigCheck(); raidCheck(); chatSync(); gmRender(); tick();
  const pk = [d.gAuto, d.gChan, d.gWorker].join('|'); if (pk !== pollKey) { pollKey = pk; autoN = null; poll(); }
});
