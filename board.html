<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --cyan:#19e3ff; --pink:#ff2e88; --glass:rgba(6,10,24,.82); --ink:#eaf9ff; }
  html,body { margin:0; width:1920px; height:1080px; background:transparent; overflow:hidden;
    font-family:'Oxanium','Segoe UI',Arial,sans-serif; color:var(--ink); }
  #board { position:absolute; top:48px; left:50%; transform:translateX(-50%); display:flex; align-items:stretch;
    height:120px; transition:opacity .5s, transform .5s; }
  #board.hidden { opacity:0; transform:translateX(-50%) translateY(-30px); }
  .team { display:flex; align-items:center; gap:28px; padding:0 40px; background:var(--glass); min-width:420px; }
  .team.a { clip-path:polygon(0 0,100% 0,calc(100% - 28px) 100%,0 100%); border-bottom:4px solid var(--cyan); justify-content:flex-end; }
  .team.b { clip-path:polygon(28px 0,100% 0,100% 100%,0 100%); border-bottom:4px solid var(--pink); flex-direction:row-reverse; justify-content:flex-end; }
  .name { font-size:44px; font-weight:700; letter-spacing:.04em; white-space:nowrap; }
  .score { font-size:84px; font-weight:800; min-width:90px; text-align:center; font-variant-numeric:tabular-nums; }
  .a .score { color:var(--cyan); text-shadow:0 0 24px rgba(25,227,255,.7); }
  .b .score { color:var(--pink); text-shadow:0 0 24px rgba(255,46,136,.7); }
  .score.pop { animation:pop .45s ease-out; }
  @keyframes pop { 0%{transform:scale(1.45);filter:brightness(2)} 100%{transform:scale(1);filter:none} }
  #mid { display:flex; align-items:center; justify-content:center; min-width:150px; padding:0 22px; background:rgba(6,10,24,.95);
    font-size:26px; font-weight:500; letter-spacing:.12em; color:#9fb4c4; text-align:center; }
  @media (prefers-reduced-motion:reduce){ .score.pop{animation:none} }
</style>
</head>
<body>
<div id="board" class="hidden">
  <div class="team a"><div class="name" id="nameA">TEAM A</div><div class="score" id="scoreA">0</div></div>
  <div id="mid">VS</div>
  <div class="team b"><div class="name" id="nameB">TEAM B</div><div class="score" id="scoreB">0</div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBKUIKlJFekXZBqGFDJPSbB26uyUc2erB4",
  authDomain: "scoreboard-64131.firebaseapp.com",
  databaseURL: "https://scoreboard-64131-default-rtdb.firebaseio.com",
  projectId: "scoreboard-64131",
  storageBucket: "scoreboard-64131.firebasestorage.app",
  messagingSenderId: "898885184342",
  appId: "1:898885184342:web:1434e53e5af35b18d4c4f7"
};
firebase.initializeApp(firebaseConfig);

const $ = id => document.getElementById(id);
const last = {};
function setScore(id, val) {
  const el = $(id);
  if (last[id] !== undefined && last[id] !== val) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  last[id] = val; el.textContent = val;
}
firebase.database().ref('board').on('value', snap => {
  const d = snap.val();
  if (!d) return;
  $('nameA').textContent = d.nameA || 'TEAM A';
  $('nameB').textContent = d.nameB || 'TEAM B';
  setScore('scoreA', d.scoreA || 0);
  setScore('scoreB', d.scoreB || 0);
  $('mid').textContent = d.label || 'VS';
  $('board').classList.toggle('hidden', d.visible === false);
});
</script>
</body>
</html>
